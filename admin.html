<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon-32.png">
  <title>Panel Admin — ORNAPLANT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'g950': '#203b31', 'g900': '#2a4f40', 'g800': '#396452', 'g600': '#56816d',
            'g400': '#7da592', 'g100': '#eef4ec', 'g50': '#f4f9f5',
            'm700': '#b43c6d', 'e200': '#ddd2bf', 'cream': '#f8f7f1'
          },
          fontFamily: { heading: ['Plus Jakarta Sans','system-ui','sans-serif'], body: ['Manrope','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Manrope', system-ui, sans-serif; background: #f4f9f5; margin: 0; }
    h1,h2,h3,h4,h5 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadein { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    /* ── LAYOUT ──────────────────────────────────────────────── */
    .admin-shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    @media (max-width: 768px) { .admin-shell { grid-template-columns: 1fr; } }

    /* ── SIDEBAR ─────────────────────────────────────────────── */
    .admin-sidebar {
      background: #203b31; color: white;
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      flex-shrink: 0;
    }
    @media (max-width: 768px) { .admin-sidebar { display: none; } }
    .sidebar-logo {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-nav { padding: 0.75rem 0.75rem; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 0.625rem;
      padding: 0.625rem 0.875rem; border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.875rem; font-weight: 600;
      color: rgba(255,255,255,0.65); text-decoration: none;
      transition: background 150ms, color 150ms; cursor: pointer;
      margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9); }
    .nav-item.active { background: rgba(255,255,255,0.12); color: white; }
    .nav-item .material-symbols-outlined { font-size: 1.125rem; flex-shrink: 0; }
    .sidebar-footer { padding: 0.75rem; border-top: 1px solid rgba(255,255,255,0.08); }

    /* ── MAIN CONTENT ────────────────────────────────────────── */
    .admin-main { display: flex; flex-direction: column; min-height: 100vh; }
    .content-header {
      background: white; border-bottom: 1px solid #e8efeb;
      padding: 0.875rem 1.75rem;
      display: flex; align-items: center; justify-content: flex-end; gap: 1rem;
      position: sticky; top: 0; z-index: 50;
    }
    .content-body { padding: 1.75rem; flex: 1; max-width: 1100px; width: 100%; }

    /* ── STAT CARDS ──────────────────────────────────────────── */
    .stat-card {
      background: white; border: 1px solid #e8efeb; border-radius: 12px;
      padding: 1.125rem 1.25rem;
      display: flex; align-items: center; gap: 0.875rem;
      animation: fadein 250ms ease-out;
    }
    .stat-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: #eef4ec; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .stat-icon .material-symbols-outlined { font-size: 1.25rem; color: #396452; }
    .stat-num { font-family: 'Plus Jakarta Sans',sans-serif; font-size: 1.5rem; font-weight: 800; color: #1a3028; line-height: 1; }
    .stat-label { font-size: 0.75rem; color: #6b8c7a; margin-top: 2px; }

    /* ── TOOLBAR ─────────────────────────────────────────────── */
    .toolbar-select {
      padding: 0.4rem 0.625rem; border: 1px solid #d9e8df; border-radius: 8px;
      font-size: 0.8125rem; font-family: 'Plus Jakarta Sans',sans-serif; font-weight: 600;
      color: #223029; background: white; cursor: pointer;
      transition: border-color 150ms;
    }
    .toolbar-select:focus { outline: none; border-color: #56816d; }

    /* ── PLANT CARDS ─────────────────────────────────────────── */
    .plant-card {
      display: grid; grid-template-columns: 60px 1fr auto;
      gap: 0.875rem; align-items: center;
      padding: 0.875rem 1rem; border-bottom: 1px solid #f0f5f2;
      transition: background 120ms;
      animation: fadein 200ms ease-out;
    }
    .plant-card:last-child { border-bottom: none; }
    .plant-card:hover { background: #f9fcfa; }
    .plant-thumb {
      width: 56px; height: 56px; border-radius: 10px; object-fit: cover;
      background: #eef4ec; flex-shrink: 0;
    }
    .plant-cat-badge {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 100px;
      font-size: 0.7rem; font-family: 'Plus Jakarta Sans',sans-serif; font-weight: 700;
      background: #eef4ec; color: #396452; text-transform: capitalize; margin-top: 3px;
    }

    /* Availability select styled as pill badge */
    .disp-select {
      padding: 0.25rem 0.625rem; border-radius: 100px;
      font-size: 0.75rem; font-family: 'Plus Jakarta Sans',sans-serif; font-weight: 700;
      cursor: pointer; border: none; outline: none; appearance: none; -webkit-appearance: none;
      text-align: center; min-width: 90px;
    }
    .disp-select.disponible  { background: #dcfce7; color: #166534; }
    .disp-select.bajo-pedido { background: #fef9c3; color: #854d0e; }
    .disp-select.agotado     { background: #fee2e2; color: #991b1b; }

    /* ── BUTTONS ─────────────────────────────────────────────── */
    .btn-icon {
      width: 34px; height: 34px; border-radius: 8px; border: none;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 150ms; flex-shrink: 0;
    }
    .btn-icon .material-symbols-outlined { font-size: 1rem; }
    .btn-edit   { background: #eef4ec; color: #396452; }
    .btn-edit:hover   { background: #d6ead9; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
    .btn-delete:hover { background: #fecaca; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.375rem;
      padding: 0.5625rem 1.125rem; background: #396452; color: white;
      border: none; border-radius: 10px; cursor: pointer;
      font-family: 'Plus Jakarta Sans',sans-serif; font-weight: 700; font-size: 0.875rem;
      transition: background 150ms;
    }
    .btn-primary:hover { background: #203b31; }
    .btn-primary .material-symbols-outlined { font-size: 1.125rem; }

    /* ── SEARCH ──────────────────────────────────────────────── */
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 380px; }
    .search-wrap input {
      width: 100%; padding: 0.5rem 0.875rem 0.5rem 2.25rem;
      border: 1px solid #d9e8df; border-radius: 9px;
      font-size: 0.875rem; font-family: inherit; color: #223029; background: white;
      transition: border-color 200ms, box-shadow 200ms; outline: none;
    }
    .search-wrap input:focus { border-color: #56816d; box-shadow: 0 0 0 3px rgba(86,129,109,0.1); }
    .search-wrap .si {
      position: absolute; left: 0.625rem; top: 50%; transform: translateY(-50%);
      color: #7da592; pointer-events: none;
    }
    .search-wrap .si .material-symbols-outlined { font-size: 1.125rem; display: block; }

    /* ── PAGINATION ──────────────────────────────────────────── */
    .admin-pagination {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 0.375rem; padding: 1rem; border-top: 1px solid #f0f5f2; background: #f9fcfa;
    }
    .admin-pagination button {
      min-width: 2.25rem; height: 2.25rem; padding: 0 0.5rem;
      background: white; border: 1px solid #d9e8df; border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 0.875rem;
      color: #223029; cursor: pointer; transition: background 150ms, border-color 150ms;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .admin-pagination button:hover:not(:disabled):not(.is-active) { background: #eef4ec; border-color: #56816d; }
    .admin-pagination button.is-active { background: #396452; color: white; border-color: #396452; cursor: default; }
    .admin-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .admin-pagination .ellipsis { min-width: 1.5rem; text-align: center; color: #7da592; }
    .admin-pagination .material-symbols-outlined { font-size: 1.125rem; }

    /* ── MODAL ───────────────────────────────────────────────── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: white; border-radius: 16px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
    .modal-header { padding: 1.5rem; border-bottom: 1px solid #e8efeb; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 1; }
    .form-label { display: block; font-size: 0.8125rem; font-weight: 700; color: #223029; margin-bottom: 0.375rem; font-family: 'Plus Jakarta Sans', sans-serif; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #d9e8df;
      border-radius: 8px; font-size: 0.9rem; font-family: inherit; color: #223029;
      background: white; outline: none; transition: border-color 200ms, box-shadow 200ms;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #56816d; box-shadow: 0 0 0 3px rgba(86,129,109,0.12);
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .btn-ghost { background: transparent; color: #396452; border: 1.5px solid #d9e8df; border-radius: 8px; padding: 0.5rem 1rem; font-family: 'Plus Jakarta Sans',sans-serif; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: background 150ms; display: inline-flex; align-items: center; gap: 0.375rem; }
    .btn-ghost:hover { background: #eef4ec; }
    .btn-danger-sm { background: #fee2e2; color: #991b1b; border: none; border-radius: 8px; padding: 0.5rem 1rem; font-family: 'Plus Jakarta Sans',sans-serif; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: background 150ms; display: inline-flex; align-items: center; gap: 0.375rem; }
    .btn-danger-sm:hover { background: #fecaca; }
  </style>
</head>
<body>

  <!-- AUTH: LOADING -->
  <div id="authLoading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f9f5;">
    <div style="text-align:center;">
      <img src="assets/logo-symbol-web.png" alt="" aria-hidden="true" style="width:48px;height:48px;margin:0 auto 1.5rem;display:block;opacity:0.35;">
      <div style="width:28px;height:28px;border:3px solid rgba(57,100,82,0.2);border-top-color:#396452;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div>
    </div>
  </div>

  <!-- AUTH: LOGIN SCREEN -->
  <div id="loginScreen" style="display:none;min-height:100vh;background:#eef4ec;align-items:center;justify-content:center;padding:1.5rem;">
    <div style="text-align:center;width:100%;max-width:380px;">
      <div style="margin-bottom:2rem;">
        <img src="assets/logo-symbol-web.png" alt="" aria-hidden="true" style="width:52px;height:52px;margin:0 auto 0.75rem;display:block;">
        <img src="assets/logo-palabras-web.png" alt="ORNAPLANT" style="height:22px;margin:0 auto;display:block;opacity:0.75;">
      </div>
      <div style="background:white;border-radius:16px;padding:2rem;box-shadow:0 8px 32px rgba(32,59,49,0.1);border:1px solid #e8efeb;">
        <h1 style="font-size:1.2rem;font-weight:800;color:#1a3028;margin-bottom:0.375rem;">Panel de Administración</h1>
        <p style="font-size:0.875rem;color:#6b8c7a;margin-bottom:1.5rem;line-height:1.6;">Acceso exclusivo para personal autorizado</p>
        <div style="display:flex;flex-direction:column;gap:0.875rem;">
          <div>
            <label class="form-label" for="loginEmail">Correo electrónico</label>
            <input class="form-input" id="loginEmail" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
          </div>
          <div>
            <label class="form-label" for="loginPassword">Contraseña</label>
            <input class="form-input" id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button id="emailSignInBtn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.75rem 1.5rem;background:#396452;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.9375rem;color:white;cursor:pointer;transition:background 150ms;margin-top:0.25rem;">
            <span class="material-symbols-outlined" style="font-size:1.125rem;">login</span>
            Iniciar sesión
          </button>
        </div>
        <p id="loginError" style="display:none;margin-top:1rem;font-size:0.8125rem;color:#991b1b;background:#fee2e2;border-radius:8px;padding:0.625rem 0.875rem;text-align:left;line-height:1.5;"></p>
      </div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none;">
    <div class="admin-shell">

      <!-- SIDEBAR -->
      <aside class="admin-sidebar">
        <div class="sidebar-logo">
          <div style="display:flex;align-items:center;gap:0.625rem;">
            <img src="assets/logo-symbol-web.png" alt="" aria-hidden="true" style="width:32px;height:32px;opacity:0.9;">
            <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1rem;color:white;letter-spacing:-0.01em;">Ornaplant</span>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Navegación principal">
          <button class="nav-item active" aria-current="page">
            <span class="material-symbols-outlined">shelves</span>
            Inventario
          </button>
          <button class="nav-item" disabled style="opacity:0.4;cursor:not-allowed;">
            <span class="material-symbols-outlined">receipt_long</span>
            Pedidos
          </button>
          <button class="nav-item" disabled style="opacity:0.4;cursor:not-allowed;">
            <span class="material-symbols-outlined">group</span>
            Clientes
          </button>
          <button class="nav-item" disabled style="opacity:0.4;cursor:not-allowed;">
            <span class="material-symbols-outlined">settings</span>
            Configuración
          </button>
        </nav>

        <div class="sidebar-footer">
          <a href="index.html" class="nav-item" style="color:rgba(255,255,255,0.55);">
            <span class="material-symbols-outlined">open_in_new</span>
            Ver sitio
          </a>
          <button class="nav-item" data-action="sign-out" style="color:rgba(255,255,255,0.55);">
            <span class="material-symbols-outlined">logout</span>
            Cerrar sesión
          </button>
        </div>
      </aside>

      <!-- MAIN -->
      <div class="admin-main">

        <!-- TOP BAR -->
        <header class="content-header">
          <span id="adminEmail" style="font-size:0.8125rem;color:#6b8c7a;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;"></span>
          <div style="width:1px;height:16px;background:#e8efeb;"></div>
          <a href="index.html" style="font-size:0.8125rem;color:#396452;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;text-decoration:none;display:flex;align-items:center;gap:0.25rem;">
            Ver sitio <span class="material-symbols-outlined" style="font-size:0.875rem;">open_in_new</span>
          </a>
          <span style="color:#d9e8df;">|</span>
          <button data-action="sign-out" style="background:none;border:none;font-size:0.8125rem;color:#6b8c7a;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;padding:0;">Log Out</button>
        </header>

        <div class="content-body">

          <!-- PAGE TITLE -->
          <h1 style="font-size:1.375rem;font-weight:800;color:#1a3028;margin:0 0 1.25rem;">Panel de Administración</h1>

          <!-- STATS -->
          <section aria-labelledby="stats-heading" style="margin-bottom:1.75rem;">
            <h2 id="stats-heading" class="sr-only">Resumen</h2>
            <div id="statsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.75rem;"></div>
          </section>

          <!-- INVENTORY SECTION -->
          <section aria-labelledby="plants-heading">

            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:1rem;flex-wrap:wrap;">
              <h2 id="plants-heading" style="font-size:1.125rem;font-weight:800;color:#1a3028;margin:0;">Inventario</h2>
              <button class="btn-primary" id="addPlantBtn">
                <span class="material-symbols-outlined">add</span>
                Agregar Planta
              </button>
            </div>

            <!-- SEARCH + FILTERS -->
            <div style="display:flex;align-items:center;gap:0.625rem;margin-bottom:0.625rem;flex-wrap:wrap;">
              <div class="search-wrap">
                <span class="si"><span class="material-symbols-outlined">search</span></span>
                <input type="search" id="adminSearch" placeholder="Buscar por nombre, etiqueta o SKU..." aria-label="Buscar plantas">
              </div>
              <span id="adminCount" style="font-size:0.8125rem;color:#7da592;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;" aria-live="polite"></span>
            </div>

            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
              <select id="filterCat" class="toolbar-select" aria-label="Filtrar por categoría">
                <option value="">Todas las categorías</option>
                <option value="ornamental">Ornamental</option>
                <option value="suculenta">Suculenta</option>
                <option value="árbol">Árbol</option>
                <option value="interior">Interior</option>
                <option value="exterior">Exterior</option>
                <option value="medicinal">Medicinal</option>
              </select>
              <select id="filterDisp" class="toolbar-select" aria-label="Filtrar por disponibilidad">
                <option value="">Disponibilidad</option>
                <option value="disponible">Disponible</option>
                <option value="bajo pedido">Bajo pedido</option>
                <option value="agotado">Agotado</option>
              </select>
              <select id="filterSuc" class="toolbar-select" aria-label="Filtrar por sucursal">
                <option value="">Sucursal</option>
                <option value="ambas">Ambas</option>
                <option value="matriz">Matriz</option>
                <option value="embarques">Embarques</option>
              </select>
              <select id="sortSelect" class="toolbar-select" aria-label="Ordenar" style="margin-left:auto;">
                <option value="nombre:asc">Nombre A→Z</option>
                <option value="nombre:desc">Nombre Z→A</option>
                <option value="sku:asc">SKU A→Z</option>
                <option value="vistas:desc">Más vistas</option>
                <option value="vistas:asc">Menos vistas</option>
              </select>
            </div>

            <!-- PLANT LIST -->
            <div style="background:white;border:1px solid #e8efeb;border-radius:14px;overflow:hidden;">
              <div id="plantList"><!-- rendered by JS --></div>
              <nav class="admin-pagination" id="adminPagination" aria-label="Paginación de plantas" hidden></nav>
            </div>

          </section>
        </div><!-- /content-body -->
      </div><!-- /admin-main -->
    </div><!-- /admin-shell -->
  </div><!-- /adminPanel -->

  <!-- MODAL: Add / Edit Plant -->
  <div class="modal-overlay" id="plantModal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size:1.125rem;font-weight:700;margin:0;color:#1a3028;">Agregar planta</h3>
        <button data-action="close-modal" style="background:none;border:none;cursor:pointer;padding:0.25rem;border-radius:6px;color:#7da592;" aria-label="Cerrar modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div style="padding:1.5rem;display:flex;flex-direction:column;gap:1rem;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div>
            <label class="form-label" for="f-nombre">Nombre *</label>
            <input class="form-input" id="f-nombre" type="text" required>
          </div>
          <div>
            <label class="form-label" for="f-sci">Nombre científico</label>
            <input class="form-input" id="f-sci" type="text">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div>
            <label class="form-label" for="f-cat">Categoría *</label>
            <select class="form-select" id="f-cat">
              <option value="ornamental">Ornamental</option>
              <option value="suculenta">Suculenta</option>
              <option value="árbol">Árbol</option>
              <option value="interior">Interior</option>
              <option value="exterior">Exterior</option>
              <option value="medicinal">Medicinal</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="f-disp">Disponibilidad *</label>
            <select class="form-select" id="f-disp">
              <option value="disponible">Disponible</option>
              <option value="bajo pedido">Bajo pedido</option>
              <option value="agotado">Agotado</option>
            </select>
          </div>
        </div>
        <div>
          <label class="form-label" for="f-desc">Descripción *</label>
          <textarea class="form-textarea" id="f-desc"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
          <div>
            <label class="form-label" for="f-luz">Luz *</label>
            <select class="form-select" id="f-luz">
              <option value="sol directo">Sol directo</option>
              <option value="luz indirecta">Luz indirecta</option>
              <option value="media sombra">Media sombra</option>
              <option value="sombra">Sombra</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="f-riego">Riego *</label>
            <select class="form-select" id="f-riego">
              <option value="bajo">Bajo</option>
              <option value="medio">Medio</option>
              <option value="alto">Alto</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="f-cuidado">Cuidado *</label>
            <select class="form-select" id="f-cuidado">
              <option value="fácil">Fácil</option>
              <option value="intermedio">Intermedio</option>
              <option value="difícil">Difícil</option>
            </select>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div>
            <label class="form-label" for="f-suc">Sucursal *</label>
            <select class="form-select" id="f-suc">
              <option value="ambas">Ambas</option>
              <option value="matriz">Matriz</option>
              <option value="embarques">Embarques</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="f-mascotas">Mascotas *</label>
            <select class="form-select" id="f-mascotas">
              <option value="no tóxica">No tóxica</option>
              <option value="tóxica">Tóxica</option>
            </select>
          </div>
        </div>
        <div>
          <label class="form-label" for="f-etiquetas">Etiquetas (separadas por coma)</label>
          <input class="form-input" id="f-etiquetas" type="text" placeholder="popular, nueva, recomendada">
        </div>
        <div>
          <label class="form-label" for="f-variaciones">Variaciones (separadas por coma)</label>
          <input class="form-input" id="f-variaciones" type="text" placeholder="chico, mediano, grande">
        </div>
        <div>
          <label class="form-label" for="f-sku">SKU</label>
          <input class="form-input" id="f-sku" type="text" maxlength="10" placeholder="ej. CEM06P120" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label class="form-label">Imagen</label>
          <p style="font-size:0.75rem;color:#7da592;margin-bottom:0.5rem;line-height:1.4;">JPG, PNG o WebP · máx. 5MB · guardada con el nombre del SKU</p>
          <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
            <label class="btn-ghost" style="cursor:pointer;position:relative;">
              <span class="material-symbols-outlined" style="font-size:1rem;">upload</span>
              Subir imagen
              <input type="file" accept="image/jpeg,image/png,image/webp" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
            </label>
            <span id="uploadStatus0" style="font-size:0.8rem;color:#7da592;"></span>
          </div>
          <div id="imgPreview0" style="display:none;margin-top:0.625rem;">
            <img id="imgPreviewEl0" style="width:100%;max-height:160px;object-fit:cover;border-radius:10px;border:1px solid #e8efeb;" alt="Preview">
          </div>
        </div>
      </div>
      <div style="padding:1rem 1.5rem;border-top:1px solid #e8efeb;display:flex;justify-content:flex-end;gap:0.75rem;">
        <button class="btn-ghost" data-action="close-modal">Cancelar</button>
        <button class="btn-primary" id="saveBtn">
          <span class="material-symbols-outlined" style="font-size:1rem;">save</span>
          Guardar
        </button>
      </div>
    </div>
  </div>

  <!-- Plant row template — textContent only (XSS-safe) -->
  <template id="plant-row-template">
    <div class="plant-card" data-id="">
      <img class="plant-thumb" src="" alt="" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=200'">
      <div>
        <div class="plant-nombre" style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.9375rem;color:#1a3028;line-height:1.2;"></div>
        <div class="plant-cientifico" style="font-size:0.8rem;color:#7da592;font-style:italic;margin-top:1px;"></div>
        <div class="plant-cat-badge"></div>
        <div class="plant-meta" style="font-size:0.75rem;color:#a0b9ad;margin-top:3px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;display:none;"></div>
      </div>
      <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0;">
        <select class="disp-select" aria-label="">
          <option value="disponible">Disponible</option>
          <option value="bajo pedido">Bajo pedido</option>
          <option value="agotado">Agotado</option>
        </select>
        <button class="btn-icon btn-edit edit-btn" aria-label="">
          <span class="material-symbols-outlined">edit</span>
        </button>
        <button class="btn-icon btn-delete delete-btn" aria-label="">
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
    </div>
  </template>

  <script type="module" src="js/admin/main.js"></script>
</body>
</html>
