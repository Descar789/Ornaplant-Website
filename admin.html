<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon-32.png">
  <title>Panel Admin — ORNAPLANT</title>
  <!-- Tailwind CDN — allowed for admin.html per project spec -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'g950': '#203b31', 'g800': '#396452', 'g600': '#56816d', 'g100': '#eef4ec',
            'm700': '#b43c6d', 'm900': '#8f2d55', 'm100': '#f8eaf1',
            'e700': '#7b674c', 'e200': '#ddd2bf', 'cream': '#f8f7f1'
          },
          fontFamily: { heading: ['Plus Jakarta Sans','system-ui','sans-serif'], body: ['Manrope','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
  <style>
    body { font-family: 'Manrope', system-ui, sans-serif; background: #f8f7f1; }
    h1,h2,h3,h4 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: white; border-radius: 16px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
    .modal-header { padding: 1.5rem; border-bottom: 1px solid rgba(51,92,75,0.16); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 1; }
    .form-label { display: block; font-size: 0.8125rem; font-weight: 700; color: #223029; margin-bottom: 0.375rem; font-family: 'Plus Jakarta Sans', sans-serif; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 0.625rem 0.875rem; border: 1px solid rgba(51,92,75,0.16);
      border-radius: 8px; font-size: 0.9rem; font-family: inherit; color: #223029;
      background: white; transition: border-color 200ms, box-shadow 200ms;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none; border-color: #56816d; box-shadow: 0 0 0 3px rgba(86,129,109,0.12);
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .btn-admin { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; transition: all 200ms; border: none; }
    .btn-primary-a { background: #396452; color: white; }
    .btn-primary-a:hover { background: #203b31; }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .btn-danger:hover { background: #fecaca; }
    .btn-ghost-a { background: transparent; color: #396452; border: 1.5px solid rgba(51,92,75,0.3); }
    .btn-ghost-a:hover { background: #eef4ec; }
    .stat-card { background: white; border: 1px solid rgba(51,92,75,0.16); border-radius: 12px; padding: 1.25rem 1.5rem; }
    .plant-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 1rem; align-items: center; padding: 0.875rem 1rem; border-bottom: 1px solid rgba(51,92,75,0.1); }
    .plant-row:last-child { border-bottom: none; }
    .plant-thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #eef4ec; }
    .disp-select { padding: 0.25rem 0.5rem; border: 1px solid rgba(51,92,75,0.16); border-radius: 6px; font-size: 0.8rem; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; cursor: pointer; }
    .disp-select.disponible { background: #dcfce7; color: #166534; }
    .disp-select.bajo-pedido { background: #fef9c3; color: #854d0e; }
    .disp-select.agotado { background: #fee2e2; color: #991b1b; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .admin-search {
      position: relative; flex: 1; min-width: 220px; max-width: 420px;
    }
    .admin-search input {
      width: 100%; padding: 0.5rem 0.875rem 0.5rem 2.25rem;
      border: 1px solid rgba(51,92,75,0.16); border-radius: 8px;
      font-size: 0.875rem; font-family: inherit; color: #223029; background: white;
      transition: border-color 200ms, box-shadow 200ms;
    }
    .admin-search input:focus { outline: none; border-color: #56816d; box-shadow: 0 0 0 3px rgba(86,129,109,0.12); }
    .admin-search .si {
      position: absolute; left: 0.625rem; top: 50%; transform: translateY(-50%);
      color: #69776d; pointer-events: none; display: inline-flex;
    }
    .admin-search .si .material-symbols-outlined { font-size: 1.125rem; }
    .admin-pagination {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 0.375rem; padding: 1rem; border-top: 1px solid rgba(51,92,75,0.1); background: #fafaf6;
    }
    .admin-pagination button {
      min-width: 2.25rem; height: 2.25rem; padding: 0 0.625rem;
      background: white; border: 1px solid rgba(51,92,75,0.16); border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 0.875rem;
      color: #223029; cursor: pointer;
      transition: background 200ms, color 200ms, border-color 200ms;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .admin-pagination button:hover:not(:disabled):not(.is-active) { background: #eef4ec; border-color: #56816d; }
    .admin-pagination button.is-active { background: #396452; color: white; border-color: #396452; cursor: default; }
    .admin-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .admin-pagination .ellipsis { min-width: 1.5rem; text-align: center; color: #69776d; user-select: none; font-family: 'Plus Jakarta Sans', sans-serif; }
    .admin-pagination .material-symbols-outlined { font-size: 1.125rem; }
  </style>
</head>
<body>

  <!-- AUTH: LOADING -->
  <div id="authLoading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f7f1;">
    <div style="text-align:center;">
      <img src="assets/logo-symbol-web.png" alt="" aria-hidden="true" style="width:52px;height:52px;margin:0 auto 1.5rem;display:block;opacity:0.4;">
      <div style="width:28px;height:28px;border:3px solid rgba(57,100,82,0.2);border-top-color:#396452;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div>
    </div>
  </div>

  <!-- AUTH: LOGIN SCREEN -->
  <div id="loginScreen" style="display:none;min-height:100vh;background:#eef4ec;align-items:center;justify-content:center;padding:1.5rem;">
    <div style="text-align:center;width:100%;max-width:400px;">
      <div style="margin-bottom:2rem;">
        <img src="assets/logo-symbol-web.png" alt="" aria-hidden="true" style="width:56px;height:56px;margin:0 auto 0.75rem;display:block;">
        <img src="assets/logo-palabras-web.png" alt="ORNAPLANT" style="height:22px;margin:0 auto;display:block;opacity:0.75;">
      </div>
      <div style="background:white;border-radius:16px;padding:2rem;box-shadow:0 8px 32px rgba(32,59,49,0.12);border:1px solid rgba(51,92,75,0.1);">
        <h1 style="font-size:1.25rem;font-weight:800;color:#223029;margin-bottom:0.5rem;">Panel de Administración</h1>
        <p style="font-size:0.875rem;color:#69776d;margin-bottom:1.5rem;line-height:1.6;">Acceso exclusivo para personal autorizado</p>
        <div style="display:flex;flex-direction:column;gap:0.875rem;">
          <div>
            <label class="form-label" for="loginEmail">Correo electrónico</label>
            <input class="form-input" id="loginEmail" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
          </div>
          <div>
            <label class="form-label" for="loginPassword">Contraseña</label>
            <input class="form-input" id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button id="emailSignInBtn"
            style="width:100%;display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.75rem 1.5rem;background:#396452;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:0.9375rem;color:white;cursor:pointer;transition:background 150ms;margin-top:0.25rem;">
            <span class="material-symbols-outlined" style="font-size:1.125rem;">login</span>
            Iniciar sesión
          </button>
        </div>
        <p id="loginError" style="display:none;margin-top:1rem;font-size:0.8125rem;color:#991b1b;background:#fee2e2;border-radius:8px;padding:0.625rem 0.875rem;text-align:left;line-height:1.5;"></p>
      </div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none;">

    <!-- HEADER -->
    <header style="background:#203b31;color:white;padding:1rem 0;position:sticky;top:0;z-index:100;box-shadow:0 4px 16px rgba(32,59,49,0.2);">
      <div style="max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;">
        <div style="display:flex;align-items:center;gap:0.75rem;flex-shrink:0;">
          <span class="material-symbols-outlined" style="font-size:1.375rem;color:#56816d;">admin_panel_settings</span>
          <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1rem;">Panel Admin</span>
          <span style="font-size:0.7rem;background:rgba(86,129,109,0.3);color:#9ec4b0;padding:0.15rem 0.5rem;border-radius:100px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;">LIVE</span>
        </div>
        <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;justify-content:flex-end;">
          <span id="adminEmail" style="font-size:0.8125rem;color:rgba(255,255,255,0.65);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
          <a href="index.html" class="btn-admin btn-ghost-a" style="color:rgba(255,255,255,0.7);border-color:rgba(255,255,255,0.2);">
            <span class="material-symbols-outlined" style="font-size:1rem;">open_in_new</span>
            Ver sitio
          </a>
          <button class="btn-admin btn-ghost-a" data-action="sign-out" style="color:rgba(255,255,255,0.7);border-color:rgba(255,255,255,0.2);" aria-label="Cerrar sesión">
            <span class="material-symbols-outlined" style="font-size:1rem;">logout</span>
          </button>
        </div>
      </div>
    </header>

    <main style="max-width:1200px;margin:0 auto;padding:2rem 1.5rem;">

      <!-- STATS -->
      <section style="margin-bottom:2.5rem;" aria-labelledby="stats-heading">
        <h2 id="stats-heading" style="font-size:1rem;font-weight:700;color:#69776d;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:1rem;">Resumen</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;" id="statsGrid"></div>
      </section>

      <!-- PLANT LIST -->
      <section aria-labelledby="plants-heading">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:1rem;">
          <h2 id="plants-heading" style="font-size:1.25rem;font-weight:700;color:#223029;">Plantas</h2>
          <button class="btn-admin btn-primary-a" id="addPlantBtn">
            <span class="material-symbols-outlined" style="font-size:1.125rem;">add</span>
            Agregar planta
          </button>
        </div>
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem;flex-wrap:wrap;">
          <div class="admin-search">
            <span class="si"><span class="material-symbols-outlined">search</span></span>
            <input type="search" id="adminSearch" placeholder="Buscar por nombre, etiqueta o SKU..." aria-label="Buscar plantas">
          </div>
          <span id="adminCount" style="font-size:0.8125rem;color:#69776d;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;" aria-live="polite"></span>
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
          <select id="filterCat" aria-label="Filtrar por categoría" style="padding:0.375rem 0.625rem;border:1px solid rgba(51,92,75,0.16);border-radius:8px;font-size:0.8125rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;color:#223029;background:white;cursor:pointer;">
            <option value="">Todas las categorías</option>
            <option value="ornamental">Ornamental</option>
            <option value="suculenta">Suculenta</option>
            <option value="árbol">Árbol</option>
            <option value="interior">Interior</option>
            <option value="exterior">Exterior</option>
            <option value="medicinal">Medicinal</option>
          </select>
          <select id="filterDisp" aria-label="Filtrar por disponibilidad" style="padding:0.375rem 0.625rem;border:1px solid rgba(51,92,75,0.16);border-radius:8px;font-size:0.8125rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;color:#223029;background:white;cursor:pointer;">
            <option value="">Todas las disponibilidades</option>
            <option value="disponible">Disponible</option>
            <option value="bajo pedido">Bajo pedido</option>
            <option value="agotado">Agotado</option>
          </select>
          <select id="filterSuc" aria-label="Filtrar por sucursal" style="padding:0.375rem 0.625rem;border:1px solid rgba(51,92,75,0.16);border-radius:8px;font-size:0.8125rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;color:#223029;background:white;cursor:pointer;">
            <option value="">Todas las sucursales</option>
            <option value="ambas">Ambas</option>
            <option value="matriz">Matriz</option>
            <option value="embarques">Embarques</option>
          </select>
          <select id="sortSelect" aria-label="Ordenar por" style="padding:0.375rem 0.625rem;border:1px solid rgba(51,92,75,0.16);border-radius:8px;font-size:0.8125rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;color:#223029;background:white;cursor:pointer;margin-left:auto;">
            <option value="nombre:asc">Nombre A→Z</option>
            <option value="nombre:desc">Nombre Z→A</option>
            <option value="sku:asc">SKU A→Z</option>
            <option value="vistas:desc">Más vistas</option>
            <option value="vistas:asc">Menos vistas</option>
          </select>
        </div>
        <div style="background:white;border:1px solid rgba(51,92,75,0.16);border-radius:12px;overflow:hidden;">
          <div id="plantList"><!-- rendered by JS --></div>
          <nav class="admin-pagination" id="adminPagination" aria-label="Paginación de plantas" hidden></nav>
        </div>
      </section>

    </main>

  </div>

  <!-- MODAL: Add / Edit Plant -->
  <div class="modal-overlay" id="plantModal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size:1.125rem;font-weight:700;">Agregar planta</h3>
        <button data-action="close-modal" style="background:none;border:none;cursor:pointer;padding:0.25rem;border-radius:6px;color:#69776d;" aria-label="Cerrar modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div style="padding:1.5rem;display:flex;flex-direction:column;gap:1rem;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div>
            <label class="form-label" for="f-nombre">Nombre *</label>
            <input class="form-input" id="f-nombre" type="text" required>
          </div>
          <div>
            <label class="form-label" for="f-sci">Nombre científico</label>
            <input class="form-input" id="f-sci" type="text">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div>
            <label class="form-label" for="f-cat">Categoría *</label>
            <select class="form-select" id="f-cat">
              <option value="ornamental">Ornamental</option>
              <option value="suculenta">Suculenta</option>
              <option value="árbol">Árbol</option>
              <option value="interior">Interior</option>
              <option value="exterior">Exterior</option>
              <option value="medicinal">Medicinal</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="f-disp">Disponibilidad *</label>
            <select class="form-select" id="f-disp">
              <option value="disponible">Disponible</option>
              <option value="bajo pedido">Bajo pedido</option>
              <option value="agotado">Agotado</option>
            </select>
          </div>
        </div>
        <div>
          <label class="form-label" for="f-desc">Descripción *</label>
          <textarea class="form-textarea" id="f-desc"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
          <div>
            <label class="form-label" for="f-luz">Luz *</label>
            <select class="form-select" id="f-luz">
              <option value="sol directo">Sol directo</option>
              <option value="luz indirecta">Luz indirecta</option>
              <option value="media sombra">Media sombra</option>
              <option value="sombra">Sombra</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="f-riego">Riego *</label>
            <select class="form-select" id="f-riego">
              <option value="bajo">Bajo</option>
              <option value="medio">Medio</option>
              <option value="alto">Alto</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="f-cuidado">Cuidado *</label>
            <select class="form-select" id="f-cuidado">
              <option value="fácil">Fácil</option>
              <option value="intermedio">Intermedio</option>
              <option value="difícil">Difícil</option>
            </select>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div>
            <label class="form-label" for="f-suc">Sucursal *</label>
            <select class="form-select" id="f-suc">
              <option value="ambas">Ambas</option>
              <option value="matriz">Matriz</option>
              <option value="embarques">Embarques</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="f-mascotas">Mascotas *</label>
            <select class="form-select" id="f-mascotas">
              <option value="no tóxica">No tóxica</option>
              <option value="tóxica">Tóxica</option>
            </select>
          </div>
        </div>
        <div>
          <label class="form-label" for="f-etiquetas">Etiquetas (separadas por coma)</label>
          <input class="form-input" id="f-etiquetas" type="text" placeholder="popular, nueva, recomendada">
        </div>
        <div>
          <label class="form-label" for="f-variaciones">Variaciones (separadas por coma)</label>
          <input class="form-input" id="f-variaciones" type="text" placeholder="chico, mediano, grande">
        </div>
        <div>
          <label class="form-label" for="f-sku">SKU</label>
          <input class="form-input" id="f-sku" type="text" maxlength="10" placeholder="ej. CEM06P120"
            autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label class="form-label">Imagen</label>
          <p style="font-size:0.75rem;color:#69776d;margin-bottom:0.5rem;line-height:1.4;">JPG, PNG o WebP, máximo 5MB. Se guarda en el hosting con el nombre del SKU.</p>
          <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
            <label class="btn-admin btn-ghost-a" style="cursor:pointer;position:relative;">
              <span class="material-symbols-outlined" style="font-size:1rem;">upload</span>
              Subir imagen
              <input type="file" accept="image/jpeg,image/png,image/webp" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
            </label>
            <span id="uploadStatus0" style="font-size:0.8rem;color:#69776d;"></span>
          </div>
          <div id="imgPreview0" style="display:none;margin-top:0.5rem;">
            <img id="imgPreviewEl0" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;border:1px solid rgba(51,92,75,0.16);" alt="Preview">
          </div>
        </div>
      </div>
      <div style="padding:1rem 1.5rem;border-top:1px solid rgba(51,92,75,0.12);display:flex;justify-content:flex-end;gap:0.75rem;">
        <button class="btn-admin btn-ghost-a" data-action="close-modal">Cancelar</button>
        <button class="btn-admin btn-primary-a" id="saveBtn">
          <span class="material-symbols-outlined" style="font-size:1rem;">save</span>
          Guardar
        </button>
      </div>
    </div>
  </div>

  <!-- Plant row template — filled by admin-ui-list.js via textContent (XSS-safe) -->
  <template id="plant-row-template">
    <div class="plant-row" data-id="">
      <img class="plant-thumb" src="" alt="" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=200'">
      <div>
        <div class="plant-nombre" style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.9375rem;color:#223029;"></div>
        <div class="plant-cientifico" style="font-size:0.8rem;color:#69776d;font-style:italic;"></div>
        <div class="plant-meta" style="font-size:0.75rem;color:#69776d;margin-top:0.25rem;text-transform:capitalize;"></div>
      </div>
      <div style="display:flex;align-items:center;gap:0.625rem;flex-shrink:0;">
        <select class="disp-select" aria-label="">
          <option value="disponible">Disponible</option>
          <option value="bajo pedido">Bajo pedido</option>
          <option value="agotado">Agotado</option>
        </select>
        <button class="btn-admin btn-ghost-a edit-btn" aria-label="" style="padding:0.375rem 0.625rem;">
          <span class="material-symbols-outlined" style="font-size:1rem;">edit</span>
        </button>
        <button class="btn-admin btn-danger delete-btn" aria-label="" style="padding:0.375rem 0.625rem;">
          <span class="material-symbols-outlined" style="font-size:1rem;">delete</span>
        </button>
      </div>
